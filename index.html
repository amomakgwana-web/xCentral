<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>xCentral — Verification Hub</title>
<script type="module" src="/src/backend.js"></script>
<style>
/* ══════════════════════════════════════════════════════════════
   Design tokens shared with BipraPay and the other platforms.
   Same scale, same radii, same shadow ramp, same class names —
   xCentral differs only in brand hue, as a product in the family
   rather than a separate design language.
   ══════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --white:#FFFFFF;
  --bg:#F7F8FB;--bg2:#F0F2F7;--bg3:#E8EBF2;
  --border:#DDE2EC;--border2:#C8D0DF;
  --ink:#0B0F1A;--ink2:#1E2540;--ink3:#4A5470;--ink4:#8892AA;--ink5:#B4BBCC;
  /* Brand — xCentral indigo */
  --brand:#3B3EE8;--brand2:#2F31C4;--brand3:#EFF0FE;--brand-border:#B9BBFA;
  --gr:#00A86B;--gr2:#007A4D;--gr-bg:#EDFAF4;--gr-bd:#9EECD0;
  --red:#D93025;--red-bg:#FEF2F0;--red-bd:#FAB4AD;
  --amb:#C47800;--amb-bg:#FFF8E6;--amb-bd:#F5CC6E;
  --pur:#6D28D9;--pur-bg:#F4F0FD;--pur-bd:#C4B5FD;
  --cy:#0E7490;--cy-bg:#ECFAFE;--cy-bd:#A5E4F5;
  --sidebar:60px;--header:56px;
  --r:6px;--r2:10px;--r3:16px;
  --shadow-xs:0 1px 2px rgba(11,15,26,.04),0 1px 6px rgba(11,15,26,.04);
  --shadow-sm:0 1px 3px rgba(11,15,26,.06),0 4px 16px rgba(11,15,26,.07);
  --shadow-md:0 4px 16px rgba(11,15,26,.09),0 1px 4px rgba(11,15,26,.06);
  --shadow-lg:0 8px 32px rgba(11,15,26,.12),0 2px 8px rgba(11,15,26,.08);
  --font:'Inter',Helvetica,'Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,ui-monospace,monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{color:var(--ink);font-size:13.5px;display:flex;flex-direction:column}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px}

/* ── Header ── */
header{height:var(--header);background:var(--white);border-bottom:1px solid var(--border);
  display:flex;align-items:center;flex-shrink:0;z-index:200;box-shadow:var(--shadow-xs);padding:0 16px;gap:14px}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0}
.logo-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand2));
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.logo-name{font-size:15px;font-weight:700;letter-spacing:-.4px}
.logo-name span{color:var(--brand)}
.env-badge{font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;border:1px solid}
.env-sandbox{background:var(--amb-bg);color:var(--amb);border-color:var(--amb-bd)}
.env-production{background:var(--gr-bg);color:var(--gr);border-color:var(--gr-bd)}
.hdr-search{position:relative;flex:0 1 260px;margin-left:8px}
.hdr-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink4)}
.hdr-search input{width:100%;height:30px;background:var(--bg);border:1px solid var(--border);border-radius:20px;
  padding:0 12px 0 30px;font-family:var(--font);font-size:12px;color:var(--ink);outline:none;transition:.15s}
.hdr-search input:focus{border-color:var(--brand);background:var(--white);box-shadow:0 0 0 3px rgba(59,62,232,.10)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ── Layout ── */
.shell{flex:1;display:flex;min-height:0}
aside{width:var(--sidebar);background:var(--white);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;flex-shrink:0;z-index:150}
.nav-btn{width:44px;height:42px;border:none;background:transparent;border-radius:var(--r2);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink4);
  transition:.14s;position:relative}
.nav-btn svg{width:17px;height:17px;stroke-width:1.6}
.nav-btn span{font-size:8.5px;font-weight:600;letter-spacing:.1px}
.nav-btn:hover{background:var(--bg2);color:var(--ink2)}
.nav-btn.active{background:var(--brand3);color:var(--brand)}
.nav-btn.active::before{content:'';position:absolute;left:-8px;top:9px;bottom:9px;width:3px;
  background:var(--brand);border-radius:0 3px 3px 0}
.nav-badge{position:absolute;top:3px;right:5px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;
  background:var(--red);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
main{flex:1;overflow-y:auto;min-width:0;position:relative}
.page{display:none}
.page.active{display:block}
.page-hdr{padding:18px 22px 14px;border-bottom:1px solid var(--border);background:var(--white);
  display:flex;align-items:flex-start;gap:16px;position:sticky;top:0;z-index:100}
.ph-title{font-size:17px;font-weight:700;letter-spacing:-.35px}
.ph-sub{font-size:11.5px;color:var(--ink4);margin-top:3px}
.ph-actions{margin-left:auto;display:flex;gap:7px;flex-shrink:0}
.pad{padding:18px 22px 40px}

/* ── Components ── */
.btn{height:30px;padding:0 12px;border-radius:var(--r2);border:1px solid var(--border);background:var(--white);
  font-family:var(--font);font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:.14s;white-space:nowrap}
.btn:hover{background:var(--bg2);border-color:var(--border2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand2);border-color:var(--brand2)}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(.93)}
.btn-sm{height:26px;padding:0 10px;font-size:11.5px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--r2);padding:13px 15px;
  box-shadow:var(--shadow-xs);border-left:3px solid var(--border2)}
.stat.green{border-left-color:var(--gr)}
.stat.amber{border-left-color:var(--amb)}
.stat.red{border-left-color:var(--red)}
.stat.blue{border-left-color:var(--brand)}
.stat.purple{border-left-color:var(--pur)}
.stat-lbl{font-size:10.5px;font-weight:600;color:var(--ink4);text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-size:25px;font-weight:700;margin-top:5px;letter-spacing:-.9px;font-variant-numeric:tabular-nums}
.stat-meta{font-size:11px;color:var(--ink4);margin-top:3px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r2);
  box-shadow:var(--shadow-xs);overflow:hidden;margin-top:14px}
.card-hdr{padding:11px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--white)}
.card-title{font-size:12.5px;font-weight:700}
.card-sub{font-size:11px;color:var(--ink4)}
.card-actions{margin-left:auto;display:flex;gap:6px}
.card-body{padding:15px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{text-align:left;padding:8px 14px;font-size:10px;font-weight:700;color:var(--ink4);
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
tbody td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--bg)}
.mono{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--ink4)}
/* A money figure that represents money owed, not money held. */
.arrears{color:var(--red);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;
  font-size:10.5px;font-weight:700;border:1px solid;white-space:nowrap}
.b-verified,.b-passed,.b-active,.b-completed,.b-delivered,.b-low,.b-affordable{background:var(--gr-bg);color:var(--gr2);border-color:var(--gr-bd)}
.b-rejected,.b-failed,.b-high,.b-not_affordable,.b-exhausted{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.b-review,.b-manual_review,.b-medium,.b-pending,.b-marginal,.b-in_progress{background:var(--amb-bg);color:var(--amb);border-color:var(--amb-bd)}
.b-skipped,.b-expired,.b-cancelled,.b-none{background:var(--bg2);color:var(--ink4);border-color:var(--border)}
.b-error,.b-insufficient_data{background:var(--pur-bg);color:var(--pur);border-color:var(--pur-bd)}
.b-identity{background:var(--brand3);color:var(--brand);border-color:var(--brand-border)}
/* Assurance levels — deeper tint as the bar rises. */
.b-basic{background:var(--bg2);color:var(--ink3);border-color:var(--border2)}
.b-standard{background:var(--cy-bg);color:var(--cy);border-color:var(--cy-bd)}
.b-enhanced{background:var(--pur-bg);color:var(--pur);border-color:var(--pur-bd)}
.b-document{background:var(--cy-bg);color:var(--cy);border-color:var(--cy-bd)}
.b-credit{background:var(--amb-bg);color:var(--amb);border-color:var(--amb-bd)}
.b-biometric{background:var(--pur-bg);color:var(--pur);border-color:var(--pur-bd)}
.meter{height:6px;background:var(--bg3);border-radius:4px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--gr);transition:width .3s}
.meter i.mid{background:var(--amb)}
.meter i.low{background:var(--red)}
.empty{padding:34px 20px;text-align:center;color:var(--ink4);font-size:12px}
.empty svg{width:30px;height:30px;stroke-width:1.3;margin-bottom:9px;opacity:.4}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--ink3);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;height:32px;padding:0 10px;border:1px solid var(--border);
  border-radius:var(--r2);font-family:var(--font);font-size:12.5px;color:var(--ink);background:var(--white);outline:none}
.field textarea{height:auto;padding:8px 10px;resize:vertical;min-height:62px;font-family:var(--font)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,62,232,.09)}
.field .hint{font-size:10.5px;color:var(--ink4);margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{padding:11px 13px;border-radius:var(--r2);font-size:11.5px;line-height:1.55;border:1px solid;margin-top:12px}
.note-info{background:var(--brand3);border-color:var(--brand-border);color:var(--ink2)}
.note-warn{background:var(--amb-bg);border-color:var(--amb-bd);color:#6b4400}
.note-danger{background:var(--red-bg);border-color:var(--red-bd);color:#8a1c14}
.note b{font-weight:700}
.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 14px;font-size:12px}
.kv dt{color:var(--ink4);font-weight:600}
.kv dd{color:var(--ink2)}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--border);margin-top:14px;overflow-x:auto}
.tab{padding:8px 13px;border:none;background:transparent;font-family:var(--font);font-size:12px;font-weight:600;
  color:var(--ink4);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink2)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:15px}
.tl-item::before{content:'';position:absolute;left:-19px;top:4px;width:9px;height:9px;border-radius:50%;
  background:var(--white);border:2px solid var(--border2)}
.tl-item.passed::before{border-color:var(--gr);background:var(--gr)}
.tl-item.failed::before{border-color:var(--red);background:var(--red)}
.tl-item.manual_review::before{border-color:var(--amb);background:var(--amb)}
.tl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-name{font-size:12.5px;font-weight:700}
.tl-meta{font-size:11px;color:var(--ink4);margin-top:2px}
.code{font-family:var(--mono);font-size:11px;background:var(--ink);color:#D6DCEC;padding:13px 15px;
  border-radius:var(--r2);overflow-x:auto;line-height:1.65;white-space:pre}
.code .k{color:#8AB4FF}.code .s{color:#9DE0A8}.code .c{color:#7C89A8}


/* ── Live capture ── */
/* The camera stage is the one place in this console where the content
   is a moving image, so it gets a dark ground of its own rather than
   sitting on the page's off-white. */
.stage{position:relative;background:#0B0F1A;border-radius:var(--r2);overflow:hidden;
  aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.stage video,.stage canvas,.stage img{width:100%;height:100%;object-fit:cover;display:block}
.stage.mirrored video{transform:scaleX(-1)}
.stage-empty{color:var(--ink5);font-size:12px;text-align:center;padding:20px;line-height:1.6}
.stage-empty svg{width:34px;height:34px;stroke-width:1.2;margin-bottom:10px;opacity:.5}
/* A framing guide, so the operator knows where the face should sit. */
.stage-guide{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.stage-guide::before{content:'';width:46%;aspect-ratio:3/4;border:2px dashed rgba(255,255,255,.45);
  border-radius:50% 50% 46% 46%}
.stage-badge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:20px;font-size:10.5px;font-weight:700;
  background:rgba(11,15,26,.72);color:#fff;backdrop-filter:blur(4px)}
.stage-badge .dot{width:6px;height:6px;border-radius:50%;background:#FF4B4B;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.stage-badge .dot{animation:none}}

/* Live quality read-out. Values update as the camera runs, so an
   operator fixes the lighting before capturing, not after. */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-top:10px}
.metric{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:7px 9px}
.metric-lbl{font-size:9.5px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.4px}
.metric-val{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.metric.ok .metric-val{color:var(--gr2)}
.metric.warn .metric-val{color:var(--amb)}
.metric.bad .metric-val{color:var(--red)}

/* Wizard rail. Numbered because the steps genuinely are a sequence —
   the document must be enrolled before a selfie can be matched to it. */
.steps{display:flex;gap:0;margin-bottom:16px;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:11.5px;font-weight:600;
  color:var(--ink4);white-space:nowrap;border-bottom:2px solid var(--border)}
.step.active{color:var(--brand);border-bottom-color:var(--brand)}
.step.done{color:var(--gr2);border-bottom-color:var(--gr)}
.step-no{width:19px;height:19px;border-radius:50%;background:var(--bg2);color:var(--ink4);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.step.active .step-no{background:var(--brand);color:#fff}
.step.done .step-no{background:var(--gr);color:#fff}

/* Agent panel. Each agent states its own verdict and reasoning, so the
   layout gives every one the same shape and room for a sentence. */
.agent{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--border)}
.agent:last-child{border-bottom:none}
.agent-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;border:1px solid}
.agent-icon svg{width:15px;height:15px;stroke-width:1.7}
.agent-pass{background:var(--gr-bg);color:var(--gr2);border-color:var(--gr-bd)}
.agent-concern{background:var(--amb-bg);color:var(--amb);border-color:var(--amb-bd)}
.agent-fail{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.agent-abstain{background:var(--bg2);color:var(--ink4);border-color:var(--border)}
.agent-name{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.agent-remit{font-size:10.5px;color:var(--ink4);margin-top:1px}
.agent-rationale{font-size:11.5px;color:var(--ink2);line-height:1.6;margin-top:5px}
.veto-tag{font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  padding:1px 5px;border-radius:3px;background:var(--ink);color:#fff}

/* ── Modal ── */
.modal{position:fixed;inset:0;background:rgba(11,15,26,.45);display:none;align-items:center;justify-content:center;
  z-index:500;padding:20px}
.modal.open{display:flex}
.modal-box{background:var(--white);border-radius:var(--r3);box-shadow:var(--shadow-lg);width:100%;max-width:540px;
  max-height:88vh;display:flex;flex-direction:column}
/* A customer profile carries identity, contact, capacity, three score
   tiles and a contract table — it needs the room to lay them out. */
.modal.wide .modal-box{max-width:920px}
.modal-hdr{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-title{font-size:14px;font-weight:700}
.modal-x{margin-left:auto;width:26px;height:26px;border:none;background:transparent;border-radius:6px;
  cursor:pointer;color:var(--ink4);display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--bg2);color:var(--ink)}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--white);
  box-shadow:var(--shadow-lg);z-index:400;transform:translateX(100%);transition:transform .22s ease;
  display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}

/* ── Toast ── */
#toasts{position:fixed;bottom:18px;right:18px;z-index:900;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--r2);font-size:12px;font-weight:500;
  box-shadow:var(--shadow-lg);max-width:400px;animation:slideIn .2s ease;display:flex;align-items:flex-start;gap:8px}
.toast.err{background:var(--red)}
.toast.ok{background:var(--gr2)}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@media (max-width:820px){
  aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:54px;flex-direction:row;
    justify-content:space-around;border-right:none;border-top:1px solid var(--border);overflow-x:auto}
  .nav-btn.active::before{display:none}
  main{padding-bottom:54px}
  .hdr-search{display:none}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M10 2L3 5v5c0 4.6 3 7.9 7 9.2 4-1.3 7-4.6 7-9.2V5l-7-3z" stroke-linejoin="round"/>
        <path d="M7.2 9.8l2 2 3.6-3.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="logo-name">x<span>Central</span></div>
    <div class="env-badge env-sandbox" id="envBadge">Sandbox</div>
  </div>

  <div class="hdr-search">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5L17 17" stroke-linecap="round"/></svg>
    <input type="search" id="globalSearch" placeholder="Search cases, references, subjects…">
  </div>

  <div class="hdr-right">
    <button class="btn btn-sm" id="userBtn">
